# Cluster-wide, environment-independent platform resources. The namespaces and the
# `sandbox-management` Role are per environment / use case: k8s/distributed/platform.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: session-workspace-rwo
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-balanced
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
