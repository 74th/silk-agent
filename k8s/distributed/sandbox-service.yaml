apiVersion: v1
kind: ServiceAccount
metadata:
  name: silk-agent-sandbox-service
  namespace: session-sandbox-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: silk-agent-sandbox-service-token-review
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: silk-agent-sandbox-service-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: silk-agent-sandbox-service-token-review
subjects:
  - kind: ServiceAccount
    name: silk-agent-sandbox-service
    namespace: session-sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: silk-agent-sandbox-service-management
  namespace: session-sandboxes
subjects:
  - kind: ServiceAccount
    name: silk-agent-sandbox-service
    namespace: session-sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-management
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silk-agent-sandbox-service
  namespace: session-sandbox-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-sandbox-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: silk-agent-worker
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: session-sandboxes
          podSelector:
            matchLabels:
              session-sandbox.example.com/managed: "true"
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: Service
metadata:
  name: silk-agent-sandbox-service
  namespace: session-sandbox-system
spec:
  selector:
    app.kubernetes.io/name: silk-agent-sandbox-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-sandbox-service
  namespace: session-sandbox-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-sandbox-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silk-agent-sandbox-service
    spec:
      serviceAccountName: silk-agent-sandbox-service
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: silk-agent
          command: [silk-agent, sandbox-service]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: SILK_AGENT_CONFIG
              value: /config/silk-agent-distributed.yaml
            - name: SILK_AGENT_SANDBOX_FINGERPRINT_KEY
              valueFrom:
                secretKeyRef:
                  name: silk-agent-sandbox
                  key: environment-fingerprint-key
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: silk-agent-sandbox-service-config
        - name: tmp
          emptyDir: {}
