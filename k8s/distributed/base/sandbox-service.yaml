# The ClusterRole `silk-agent-sandbox-service-token-review` is shared by every use case and is
# applied once with the platform (k8s/platform/base.yaml): deleting one use case must not remove it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silk-agent-sandbox-service
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: silk-agent-sandbox-service-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: silk-agent-sandbox-service-token-review
subjects:
  - kind: ServiceAccount
    name: silk-agent-sandbox-service
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silk-agent-sandbox-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-sandbox-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: silk-agent-worker
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              # Replaced by the platform component with the use case's Sandbox namespace.
              kubernetes.io/metadata.name: SANDBOX_NAMESPACE
          podSelector:
            matchLabels:
              session-sandbox.example.com/managed: "true"
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: v1
kind: Service
metadata:
  name: silk-agent-sandbox-service
spec:
  selector:
    app.kubernetes.io/name: silk-agent-sandbox-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-sandbox-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-sandbox-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silk-agent-sandbox-service
    spec:
      serviceAccountName: silk-agent-sandbox-service
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: silk-agent
          command: [silk-agent, sandbox-service]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: SILK_AGENT_CONFIG
              value: /config/silk-agent-distributed.yaml
            # The role compares this with the namespaces named in its config (namespace_check).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SILK_AGENT_SANDBOX_FINGERPRINT_KEY
              valueFrom:
                secretKeyRef:
                  name: silk-agent-sandbox
                  key: environment-fingerprint-key
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: silk-agent-sandbox-service-config
        - name: tmp
          emptyDir: {}
