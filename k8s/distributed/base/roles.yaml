# The three roles that run next to the Sandbox Service (sandbox-service.yaml).
#
# Released with Gateway 1 / Control 1 / Worker 2 replicas (Worker 2 is the acceptance setting).
# Re-applying this file keeps those counts; change them here, not with `kubectl scale`.
#
# Credential split: only the Gateway holds the Slack app token, only Gateway/Control hold the bot
# token, and the Worker holds no Slack secret at all. No role mounts a volume with SQLite state.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silk-agent-gateway
# Workload Identity only; no Kubernetes API token is needed by this role.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silk-agent-worker
# Workload Identity only; no Kubernetes API token is needed by this role.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: silk-agent-control
# Control reads Pods (below) to confirm a lost Worker's Pod is gone.
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silk-agent-gateway
    spec:
      serviceAccountName: silk-agent-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: silk-agent
          command: [silk-agent, gateway]
          ports:
            - name: health
              containerPort: 9090
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: SILK_AGENT_CONFIG
              value: /config/silk-agent-distributed.yaml
            - name: HOME
              value: /home/app
            # The role compares this with the namespaces named in its config (namespace_check).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - secretRef:
                name: silk-agent-slack
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: config
          configMap:
            name: silk-agent-sandbox-service-config
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silk-agent-worker
    spec:
      serviceAccountName: silk-agent-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: silk-agent
          command: [silk-agent, worker, run]
          ports:
            - name: health
              containerPort: 9090
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: SILK_AGENT_CONFIG
              value: /config/silk-agent-distributed.yaml
            - name: HOME
              value: /home/app
            # The role compares this with the namespaces named in its config (namespace_check).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            - name: work
              mountPath: /work
            - name: sandbox-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: silk-agent-sandbox-service-config
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: sandbox-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: silk-agent-sandbox-service
                  expirationSeconds: 3600
                  path: silk-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-control
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silk-agent-control
    spec:
      serviceAccountName: silk-agent-control
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control
          image: silk-agent
          command: [silk-agent, control]
          ports:
            - name: health
              containerPort: 9090
          env:
            - name: LOG_LEVEL
              value: INFO
            - name: SILK_AGENT_CONFIG
              value: /config/silk-agent-distributed.yaml
            - name: HOME
              value: /home/app
            # The role compares this with the namespaces named in its config (namespace_check).
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Control only posts to Slack: the bot token, never the app token.
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: silk-agent-slack
                  key: SLACK_BOT_TOKEN
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: config
          configMap:
            name: silk-agent-sandbox-service-config
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silk-agent-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-gateway
  # No ingress: probes come from the kubelet. Add a rule for the chosen metrics scraper.
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silk-agent-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-worker
  # No ingress: probes come from the kubelet. Add a rule for the chosen metrics scraper.
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: silk-agent-sandbox-service
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: silk-agent-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-control
  # No ingress: probes come from the kubelet. Add a rule for the chosen metrics scraper.
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: silk-agent-control-pod-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: silk-agent-control-pod-reader
subjects:
  - kind: ServiceAccount
    name: silk-agent-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: silk-agent-control-pod-reader
