# gke-session-sandbox settings (mounted at /config/sandbox-config.yaml).
namespace: session-sandboxes
control_namespace: session-sandbox-system
template_file: /app/sandbox-templates/sandbox.yaml
workspace_storage_class: session-workspace-rwo
workspace_storage: 10Gi
repository_database_path: /var/lib/session-sandbox/sessions.sqlite3
repository_require_mount: true
runtime:
  container_name: sandboxd
  image: SANDBOX_RUNTIME_IMAGE
  rest_port: 8080
  tracker_port: 8081
  grpc_port: 9090
  cpu_request: 100m
  cpu_limit: "1"
  memory_request: 128Mi
  memory_limit: 1Gi
lifecycle:
  reconcile_interval_seconds: 60
  idle_timeout_seconds: 300
  retention_seconds: 604800
network:
  # Sandboxes have no external egress except these FQDNs (DNS is always allowed).
  allowed_fqdns: []
