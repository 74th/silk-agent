# silk-agent Slack bot: the parts that do not depend on a use case (Deployment, ServiceAccount,
# RBAC, PVC, StorageClass). A deployment (k8s/overlays/dev, usecases/template/k8s) references
# this and adds its ConfigMap (silk-agent-config) and the image names.
#
# Prerequisites (provided by the platform base: k8s/distributed/overlays/dev-platform):
#   - namespaces session-sandbox-system / session-sandboxes
#   - Role session-sandboxes/sandbox-management
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:` (the RoleBinding lives in session-sandboxes); each resource sets it.
labels:
  - pairs:
      app.kubernetes.io/name: silk-agent
    includeSelectors: false
resources:
  - storageclass.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
