[project]
name = "silk-agent"
version = "0.1.0"
description = "Slack bot that runs Claude Agent SDK agents in session-scoped GKE Agent Sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2.165",
  "slack-bolt>=1.21",
  "slack-sdk>=3.33",
  "google-genai>=1.0",
  "google-cloud-modelarmor>=0.2",
  "google-cloud-aiplatform>=1.100",
  "google-cloud-storage>=2.18",
  "google-cloud-secret-manager>=2.20",
  "streamlit>=1.40",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "aiohttp>=3.14,<4",
  # gke_session_sandbox (src/gke_session_sandbox)
  "grpcio>=1.78.0",
  "kubernetes-asyncio>=35,<36",
  "protobuf>=6.31.1,<7",
]

[project.scripts]
gke-session-sandbox = "gke_session_sandbox.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "ruff>=0.8",
  "pyright>=1.1.380",
  "grpcio-tools==1.78.0",  # scripts/generate-sandboxd-proto.py
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not gke' --import-mode=importlib"
markers = [
  "integration: calls real external services (Agent Platform, Model Armor, ...); run with -m integration",
  "gke: requires access to an explicitly selected GKE validation cluster",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# gke_session_sandbox (moved from another repository) keeps its own style for now.
extend-exclude = [
  "src/gke_session_sandbox",
  "tests/session_sandbox",
  "examples",
  "scripts/generate-sandboxd-proto.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src", "apps"]
exclude = ["src/gke_session_sandbox"]  # moved from another repository; not type-clean yet
pythonVersion = "3.12"
typeCheckingMode = "standard"
