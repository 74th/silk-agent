# silk-agent settings of this use case (mounted at /config/silk-agent.yaml by k8s/).
# Relative paths are relative to this file; the use case's own files are in the Bot image under
# /app/usecase/ (see bot.Dockerfile). Replace every `your-*` value.
slack:
  app_token_secret: ""             # tokens come from the Secret silk-agent-slack (env)
  bot_token_secret: ""
  stop_words: ["停止", "中止", "中断", "STOP"]
  interrupt_mode: append           # append | interrupt | queue
filter:
  allowed_teams: [T00000000]       # your Slack workspace id
  allowed_channels: []             # empty = every channel (direct messages are not affected)
  allowed_users: []                # empty = everyone
  allow_direct_messages: true
  deny_guests: false               # true: ignore guest accounts
  deny_external_users: false       # true: ignore users of other workspaces (Slack Connect)
input_guard:
  provider: gemini
  model: gemini-3.8-flash
  project: your-gcp-project
  location: global
  policy_file: /app/usecase/policies/input-guard.md
  on_error: block
output_sanitizer:
  provider: model_armor
  template: projects/your-gcp-project/locations/us-central1/templates/your-template
  on_sdp_match: mask
session_store:
  provider: agent_platform
  project: your-gcp-project
  location: us-central1
  agent_runtime: projects/your-gcp-project/locations/us-central1/reasoningEngines/0000000000000000000
agent:
  provider: agent_platform
  project: your-gcp-project
  region: global
  model: claude-haiku-5-5
  system_prompt_file: /app/usecase/prompts/agent-system.md
mcp:
  config_file: /config/mcp.json
skills:
  source: /app/usecase/skills      # or gs://your-bucket/skills
hooks:
  - factory: silk_usecase_template.hooks:create
    options:
      include_content: false       # true: also log (masked) text, tool input and results
  - silk_agent.hooks:json_lines    # the standard hook: one JSON line per event on stdout
sandbox:
  runtime: gke_session_sandbox
  config_file: /config/sandbox-config.yaml
