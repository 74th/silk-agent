apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent
  namespace: session-sandbox-system
spec:
  template:
    spec:
      containers:
        - name: bot
          env:
            - name: ECHO_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bigquery-analysis-secrets
                  key: ECHO_MCP_API_KEY
