# Deployment of this use case: ../config (silk-agent's k8s/base + this use case's ConfigMap) with this use case's Bot image. Deploy from the silk-agent checkout with
#   KUSTOMIZE_DIR=usecases/<name>/k8s k8s/deploy.sh
# or `kubectl kustomize . | kubectl apply -f -` from this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../config
  - echo-mcp.yaml
patches:
  - path: bot-echo-secret-patch.yaml
images:
  # The Deployment's image is the placeholder `silk-agent`: use this use case's Bot image.
  - name: silk-agent
    newName: us-central1-docker.pkg.dev/nnyn-dev/silk-agent-images/bigquery-analysis-bot
    digest: sha256:64ecc03a5876a9ac5ad94796091b55daaab0f8a9251e089c55c48e3558c35807
  - name: echo-mcp
    newName: us-central1-docker.pkg.dev/nnyn-dev/silk-agent-images/bigquery-analysis-echo-mcp
    digest: sha256:60a8776a4b54caade9a99065518a88d99942c2a62e5041e678dcfda8c65becfc
