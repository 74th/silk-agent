# gke-session-sandbox settings of the Sandbox Service (mounted at /config/sandbox-config.yaml).
# SQLite fields are intentionally omitted. The Sandbox Service injects its Firestore repository.
namespace: bigquery-analysis-sandboxes
control_namespace: bigquery-analysis-system
template_file: /app/sandbox-templates/sandbox.yaml
workspace_storage_class: session-workspace-rwo
workspace_storage: 10Gi
runtime:
  container_name: sandboxd
  # This use case's Sandbox image (sandbox/Dockerfile), pinned by digest.
  image: us-central1-docker.pkg.dev/nnyn-dev/silk-agent-images/bigquery-analysis-sandbox@sha256:848cad857e9c5e07e7ae1585261ab88b0889490f5ef14450cae5c557152f143f
  rest_port: 8080
  tracker_port: 8081
  grpc_port: 9090
  cpu_request: 100m
  cpu_limit: "1"
  memory_request: 128Mi
  memory_limit: 1Gi
  # How long to wait for a Sandbox to be Ready; startup.sh runs before that.
  ready_timeout_seconds: 180
lifecycle:
  reconcile_interval_seconds: 60
  idle_timeout_seconds: 300
  retention_seconds: 604800
network:
  # Sandboxes have no external egress except these FQDNs (DNS is always allowed).
  # Add the hosts that startup.sh and the agent's tools need.
  allowed_fqdns:
    - name: bigquery.googleapis.com
      ports:
        - protocol: TCP
          port: 443
  # Workload Identity token exchange uses the GKE metadata server. Disabled by default globally;
  # this use case opts in for this conversation's Sandbox only.
  allow_gke_metadata_server: true
template_overrides:
  spec:
    podTemplate:
      spec:
        serviceAccountName: bigquery-analysis
