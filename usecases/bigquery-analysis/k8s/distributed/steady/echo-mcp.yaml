apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    # Selects the resource for the platform component's namespace replacement.
    app.kubernetes.io/part-of: silk-agent-distributed
  name: echo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo-mcp
          image: echo-mcp
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ECHO_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bigquery-analysis-secrets
                  key: ECHO_MCP_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  labels:
    # Selects the resource for the platform component's namespace replacement.
    app.kubernetes.io/part-of: silk-agent-distributed
  name: echo-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: echo-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    # Selects the resource for the platform component's namespace replacement.
    app.kubernetes.io/part-of: silk-agent-distributed
  name: echo-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: echo-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: silk-agent-worker
      ports:
        - protocol: TCP
          port: 8000
---
# The Worker's own NetworkPolicy allows no traffic to this namespace's other Pods; add echo-mcp.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    # Selects the resource for the platform component's namespace replacement.
    app.kubernetes.io/part-of: silk-agent-distributed
  name: echo-mcp-egress-from-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-worker
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: echo-mcp
      ports:
        - protocol: TCP
          port: 8000
---
# echo-mcp calls nothing: no egress at all, so it cannot reach the Sandboxes (8080 / 8081) or
# anything else if it is compromised.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    # Selects the resource for the platform component's namespace replacement.
    app.kubernetes.io/part-of: silk-agent-distributed
  name: echo-mcp-no-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: echo-mcp
  policyTypes: [Egress]
  egress: []
