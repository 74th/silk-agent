apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: ECHO_MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bigquery-analysis-secrets
                  key: ECHO_MCP_API_KEY
