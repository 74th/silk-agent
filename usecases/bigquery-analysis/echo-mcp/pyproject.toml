[project]
name = "bigquery-analysis-echo-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastmcp==2.14.5", "uvicorn==0.38.0"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4", "pytest-asyncio>=1.0"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
