apiVersion: apps/v1
kind: Deployment
metadata:
  name: silk-agent-worker
  namespace: session-sandbox-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: silk-agent-worker
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silk-agent-worker
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - silk-agent
        - worker
        - run
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: SILK_AGENT_CONFIG
          value: /config/silk-agent-distributed.yaml
        - name: HOME
          value: /home/app
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        image: us-central1-docker.pkg.dev/nnyn-dev/silk-agent-images/silk-agent@sha256:c93b31bb51e10ef6fc4c1fac208a8e3c78b4f43996dd9f1846bb11404773ced9
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        name: worker
        ports:
        - containerPort: 9090
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        volumeMounts:
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /home/app
          name: home
        - mountPath: /work
          name: work
        - mountPath: /var/run/secrets/tokens
          name: sandbox-token
          readOnly: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: silk-agent-worker
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: silk-agent-sandbox-service-config-kk4f68bckg
        name: config
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: home
      - emptyDir: {}
        name: work
      - name: sandbox-token
        projected:
          sources:
          - serviceAccountToken:
              audience: silk-agent-sandbox-service
              expirationSeconds: 3600
              path: silk-sandbox
